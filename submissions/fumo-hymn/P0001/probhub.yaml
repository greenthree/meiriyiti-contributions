schema_version: 1
id: P0001
name: 热情高唱~芙兰朵露和她的小fumo
display_name: 热情高唱~芙兰朵露和她的小fumo
difficulty: 0
tags:
- 数论
- 完全平方数
- 图
limits:
  time: 2
  memory: 256
  output: 64
  processes: 32
statement:
  source: problem.md
  quote:
    text: 幻想乡发生了物凄异变！
    source: 智慧冰精
judge:
  type: standard
  validator: code/validator.cpp
solutions:
  accepted:
  - file: code/std.cpp
    expected:
      status: AC
      all: true
  - file: code/std2.cpp
    expected:
      status: AC
      all: true
    independence:
      from: code/std.cpp
      basis: algorithm
      note: std.cpp 直接判断 s*t 是否为完全平方数；std2.cpp 先分解出两个数的平方自由部分再比较，两者使用不同的判定算法。
  brute: []
  wrong:
  - file: code/wrong.cpp
    expected:
      status: WA
      groups:
      - same
      all: false
      forbid:
      - FAIL
  - file: code/wrong2.cpp
    expected:
      status: WA
      groups:
      - square
      all: false
      forbid:
      - FAIL
  - file: code/wrong3.cpp
    expected:
      status:
      - TLE
      groups:
      - prime-large
      all: false
      forbid:
      - WA
      - FAIL
  - file: code/wrong4.cpp
    expected:
      status: WA
      groups:
      - overflow
      all: false
      forbid:
      - FAIL
generators:
- code/inmaker.cpp
data:
  sample_dir: data/sample
  secret_dir: data/secret
  groups:
  - name: boundary
    role: boundary
    patterns:
    - secret/boundary*
    - secret/same01
  - name: same
    role: wrong-solution-killer
    patterns:
    - secret/same*
    targets:
    - code/wrong.cpp
  - name: square
    role: wrong-solution-killer
    patterns:
    - secret/square*
    targets:
    - code/wrong2.cpp
  - name: unreachable
    role: boundary
    patterns:
    - secret/unreach*
  - name: overflow
    role: wrong-solution-killer
    patterns:
    - secret/overflow*
    targets:
    - code/wrong4.cpp
  - name: large
    role: performance
    patterns:
    - secret/large*
  - name: prime-large
    role: performance
    patterns:
    - secret/prime*
    targets:
    - code/wrong3.cpp
  - name: random
    role: random-supplement
    patterns:
    - secret/random*
  recipes:
  - case: same01
    manual: true
  - case: same02
    manual: true
  - case: same03
    manual: true
  - case: square01
    manual: true
  - case: square02
    manual: true
  - case: square03
    manual: true
  - case: square04
    manual: true
  - case: unreach01
    manual: true
  - case: unreach02
    manual: true
  - case: unreach03
    manual: true
  - case: overflow01
    manual: true
  - case: boundary01
    manual: true
  - case: large01
    generator: code/inmaker.cpp
    args:
    - large
  - case: prime01
    generator: code/inmaker.cpp
    args:
    - prime
  - case: random01
    generator: code/inmaker.cpp
    args:
    - random
    - '1'
  - case: random02
    generator: code/inmaker.cpp
    args:
    - random
    - '2'
domjudge:
  include_pdf: false
stress:
  generator: code/inmaker.cpp
  args:
  - random
  - '{seed}'
  brute: code/std2.cpp
  rounds: 100
  time_limit: 2
  tool_timeout: 5
