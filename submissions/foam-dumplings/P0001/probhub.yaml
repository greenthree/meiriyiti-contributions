schema_version: 1
id: P0001
name: 泡沫啊请不要离去
display_name: 泡沫啊请不要离去
difficulty: 0
tags:
- 数论
- 最大公约数
- 构造
limits:
  time: 1
  memory: 256
  output: 64
  processes: 32
statement:
  source: problem.md
  quote:
    text: 泡沫啊，请不要走，我还不愿与你分别
    source: 查米铃木
judge:
  type: standard
  validator: code/validator.cpp
solutions:
  accepted:
  - file: code/std.cpp
    expected:
      status: AC
      all: true
  - file: code/std2.cpp
    expected:
      status: AC
      all: true
    independence:
      from: code/std.cpp
      basis: key_implementation
      note: std.cpp 用奇数试除直接寻找最小质因子；std2.cpp 先筛出 31623 以内的质数，再只用质数试除，二者因子分解的关键实现不同。
  brute: []
  wrong:
  - file: code/wrong.cpp
    expected:
      status: WA
      groups:
      - impossible
      all: false
      forbid:
      - FAIL
  - file: code/wrong2.cpp
    expected:
      status: WA
      groups:
      - capacity
      all: false
      forbid:
      - FAIL
  - file: code/wrong3.cpp
    expected:
      status: WA
      groups:
      - square
      all: false
      forbid:
      - FAIL
  - file: code/wrong4.cpp
    expected:
      status:
      - TLE
      groups:
      - prime-large
      all: false
      forbid:
      - WA
      - FAIL
generators:
- code/inmaker.cpp
data:
  sample_dir: data/sample
  secret_dir: data/secret
  groups:
  - name: boundary
    role: boundary
    patterns:
    - secret/edge*
  - name: required
    role: boundary
    patterns:
    - secret/req*
  - name: impossible
    role: wrong-solution-killer
    patterns:
    - secret/req01
    - secret/edge01
    - secret/edge02
    - secret/edge04
    - secret/edge05
    - secret/cap03
    targets:
    - code/wrong.cpp
  - name: capacity
    role: wrong-solution-killer
    patterns:
    - secret/cap*
    targets:
    - code/wrong2.cpp
  - name: square
    role: wrong-solution-killer
    patterns:
    - secret/square*
    targets:
    - code/wrong3.cpp
  - name: prime-large
    role: performance
    patterns:
    - secret/large01
    targets:
    - code/wrong4.cpp
  - name: large
    role: performance
    patterns:
    - secret/large*
  recipes:
  - case: req01
    manual: true
  - case: req02
    manual: true
  - case: req03
    manual: true
  - case: edge01
    manual: true
  - case: edge02
    manual: true
  - case: edge03
    manual: true
  - case: edge04
    manual: true
  - case: edge05
    manual: true
  - case: cap01
    manual: true
  - case: cap02
    manual: true
  - case: cap03
    manual: true
  - case: square01
    manual: true
  - case: square02
    manual: true
  - case: large01
    manual: true
  - case: large02
    manual: true
  - case: large03
    manual: true
domjudge:
  include_pdf: false
stress:
  generator: code/inmaker.cpp
  args:
  - random
  - '{seed}'
  brute: code/std2.cpp
  rounds: 100
  time_limit: 1
  tool_timeout: 5
